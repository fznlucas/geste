<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Geste mark</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<div style="width: {{w}}px; height: {{h}}px; overflow: hidden; border-radius: {{r}}px; background: #F5F1EC; box-shadow: {{shadow}}">
<sc-if value="{{full}}" hint-placeholder-val="{{ true }}">

<defs>
<filter id="gesteBrush" x="-10%" y="-10%" width="120%" height="120%">
<feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" seed="7" result="noise"></feTurbulence>
<feDisplacementMap in="SourceGraphic" in2="noise" scale="2.4"></feDisplacementMap>
</filter>
</defs>
<rect x="0" y="0" width="120" height="100" style="fill: #F7F3EE"></rect>

<path d="M50 82 L64 80" style="stroke: #F2B632; stroke-width: 4; opacity: 0.85"></path>
<path d="M100 72 L112 74" style="stroke: #F2B632; stroke-width: 4; opacity: 0.85"></path>
<path d="M8 22 Q24 18 36 26" style="stroke: #E8735A; stroke-width: 9; opacity: 0.92"></path>
<path d="M44 22 Q56 16 70 24" style="stroke: #E8735A; stroke-width: 8; opacity: 0.9"></path>
<path d="M76 40 Q92 34 112 42" style="stroke: #E8735A; stroke-width: 9; opacity: 0.92"></path>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"size":{"editor":"int","min":16,"max":960,"default":480},"detail":{"editor":"enum","options":["full","simple"],"default":"full"},"lifted":{"editor":"boolean","default":false},"$preview":{"width":480,"height":400}}'>
class Component extends DCLogic {
renderVals() {
const w = Number(this.props.size ?? 480) || 480;
const h = Math.round(w * 100 / 120);
const detail = this.props.detail ?? 'full';
const lifted = this.props.lifted === true || this.props.lifted === 'true';
return {
w: w,
h: h,
r: Math.max(1, Math.round(w / 80)),
full: detail !== 'simple',
simple: detail === 'simple',
shadow: lifted ? '0 18px 40px rgba(28,26,24,0.18), 0 2px 6px rgba(28,26,24,0.10)' : 'none'
};
}
}
</script>
</body>
</html>
